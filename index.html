<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تضمين المحاضرة</title>
    <!-- مكتبة التشفير -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { background-color: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .video-container { width: 100%; max-width: 800px; }
        
        /* تصميم العلامة المائية */
        .overlay-watermark { 
            position: absolute; 
            pointer-events: none; 
            color: rgba(255, 255, 255, 0.4); 
            font-size: 1.5rem; 
            font-weight: bold; 
            z-index: 10; 
            animation: float 15s linear infinite; 
        }
        @keyframes float {
            0% { top: 10%; left: 10%; }
            50% { top: 80%; left: 70%; }
            100% { top: 10%; left: 10%; }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- كود التضمين الخاص بك مع إضافة العلامة المائية ومعرف للمشغل -->
        <div style="position:relative;padding-top:56.25%;">
            <div class="overlay-watermark" id="watermark"></div>
            
            <!-- أزلنا src مؤقتاً لنضيفه عبر الكود ليكون محمياً -->
            <iframe id="bunny-iframe" loading="lazy" style="border:0;position:absolute;top:0;height:100%;width:100%;" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen;" allowfullscreen="true"></iframe>
        </div>
    </div>

    <script>
        // 1. البيانات الأساسية
        const libraryId = '757293'; 
        const videoId = '77e5bb55-4c5c-42dd-94bd-4cfdd11be025';
        const securityKey = 'f22e28ef-5235-45c2-8988-da3bb33b6846'; 

        // 2. توليد التشفير
        function generateToken(securityKey, videoId, expirationTime) {
            const stringToSign = securityKey + videoId + expirationTime;
            const hash = CryptoJS.SHA256(stringToSign);
            return hash.toString(CryptoJS.enc.Hex); 
        }

        // 3. وقت الصلاحية (ساعتين)
        const expirationTime = Math.floor(Date.now() / 1000) + 7200;
        const token = generateToken(securityKey, videoId, expirationTime);

        // 4. دمج الرابط الخاص بك مع التشفير
        // استخدمنا نفس الإعدادات الموجودة في كود التضمين الخاص بك (autoplay, loop, etc)
        const embedUrl = `https://iframe.mediadelivery.net/embed/${libraryId}/${videoId}?autoplay=true&loop=false&muted=true&preload=true&responsive=true&token=${token}&expires=${expirationTime}`;

        // 5. تشغيل الفيديو
        document.getElementById('bunny-iframe').src = embedUrl;
        document.getElementById('watermark').innerText = 'المشترك: Ali-90123';
    </script>

</body>
</html>
