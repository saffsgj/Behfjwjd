<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة منقذ المهني - محاضرة محمية</title>
    <!-- مكتبة التشفير -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { 
            background-color: #111; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Tahoma, sans-serif; 
        }
        
        /* الحاوية الرئيسية التي تضم المشغل والعلامة معاً */
        .video-container { 
            width: 100%; 
            max-width: 850px; 
            position: relative; 
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* تنسيق الـ iframe الخاص بـ Bunny */
        .video-container iframe { 
            width: 100%; 
            height: 100%; 
            border: 0; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }

        /* العلامة المائية المتحركة (ستبقى ظاهرة حتى عند تكبير الحاوية) */
        .watermark-overlay {
            position: absolute;
            color: rgba(255, 255, 255, 0.4); 
            font-size: 1.4rem;
            font-weight: bold;
            pointer-events: none; /* لتفادي منع النقر على أزرار الفيديو */
            z-index: 99999;
            user-select: none;
            white-space: nowrap;
            animation: moveWatermark 18s linear infinite;
        }

        @keyframes moveWatermark {
            0%   { top: 10%; left: 10%; }
            30%  { top: 75%; left: 60%; }
            60%  { top: 40%; left: 80%; }
            90%  { top: 80%; left: 15%; }
            100% { top: 10%; left: 10%; }
        }

        /* زر تكبير الشاشة المخصص الخارجي لضمان بقاء العلامة المائية */
        .custom-fs-btn {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100000;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .custom-fs-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="video-container" id="videoContainer" style="position:relative; padding-top:56.25%;">
        <!-- طبقة العلامة المائية التي تعرض كود الطالب -->
        <div class="watermark-overlay" id="userWatermark">جاري التحميل...</div>

        <!-- مشغل Bunny الافتراضي -->
        <iframe id="bunnyPlayer" loading="lazy" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen;" allowfullscreen="true"></iframe>

        <!-- زر تكبير الشاشة الخاص بالحاوية للحفاظ على العلامة المائية -->
        <button class="custom-fs-btn" onclick="toggleFullScreen()">⛶ تكبير الشاشة</button>
    </div>

    <script>
        // 1. البيانات الأساسية
        const libraryId = '757293'; 
        const videoId = '77e5bb55-4c5c-42dd-94bd-4cfdd11be025';
        const securityKey = 'f22e28ef-5235-45c2-8988-da3bb33b6846'; 

        // كود الطالب الفعلي
        const currentStudentCode = 'كود الطالب: MNKZ-9082';

        // 2. دالة توليد التشفير (Token) الآمن
        function generateToken(securityKey, videoId, expirationTime) {
            const stringToSign = securityKey + videoId + expirationTime;
            const hash = CryptoJS.SHA256(stringToSign);
            return hash.toString(CryptoJS.enc.Hex); 
        }

        // 3. صلاحية الرابط (ساعتين)
        const expirationTime = Math.floor(Date.now() / 1000) + 7200;
        const token = generateToken(securityKey, videoId, expirationTime);

        // 4. تركيب الرابط الآمن
        const embedUrl = `https://iframe.mediadelivery.net/embed/${libraryId}/${videoId}?autoplay=false&loop=false&muted=false&preload=true&responsive=true&token=${token}&expires=${expirationTime}`;

        // 5. حقن الرابط وتعيين كود الطالب
        document.getElementById('bunnyPlayer').src = embedUrl;
        document.getElementById('userWatermark').innerText = currentStudentCode;

        // 6. دالة تكبير الشاشة للحاوية بالكامل (لضمان بقاء العلامة المائية ظاهرة)
        function toggleFullScreen() {
            const container = document.getElementById('videoContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) { /* Safari */
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
